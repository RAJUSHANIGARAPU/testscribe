[pytest]
# ==============================================================================
# TestScribe — pytest configuration
# ==============================================================================

# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# asyncio / anyio
# ---------------------------------------------------------------------------
asyncio_mode = auto
# Use "strict" to catch unawaited coroutines
asyncio_default_fixture_loop_scope = function

# ---------------------------------------------------------------------------
# Markers
# ---------------------------------------------------------------------------
markers =
    unit: Pure unit tests with no I/O (fast, no fixtures needed)
    integration: Tests that hit the test database
    slow: Tests that are intentionally slow (e.g. retry/timeout scenarios)
    stripe: Tests that exercise Stripe billing code paths

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_date_format = %H:%M:%S

# ---------------------------------------------------------------------------
# Filter warnings
# ---------------------------------------------------------------------------
filterwarnings =
    error
    ignore::DeprecationWarning:pydantic.*:
    ignore::DeprecationWarning:sqlalchemy.*:
    ignore::DeprecationWarning:stripe.*:
    ignore::PendingDeprecationWarning

# ---------------------------------------------------------------------------
# Timeout (requires pytest-timeout)
# ---------------------------------------------------------------------------
# timeout = 30
